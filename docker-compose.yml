services:
  app:
    build: .
    # 多环境（dev/uat 同机不同目录）：镜像名/容器名/端口都从本目录 .env 读取，
    # 不设时回落到默认值＝原单环境行为。同机多环境必须让这些值各不相同，否则会互相覆盖/端口冲突。
    image: ${IMAGE_NAME:-datamerge}:latest
    container_name: ${APP_CONTAINER_NAME:-datamerge-app}
    ports:
      - "${APP_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # REDIS_URL、DATABASE_URL 均从 .env 读取，不在 Compose 中覆盖。
      # 使用外部 Redis 时请填写其内网 IP/域名；容器内的 localhost 指向容器自身。
      - LD_LIBRARY_PATH=/app/libs:/usr/lib
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_ROLL_FORWARD=LatestMajor
    volumes:
      - ./tenants:/app/tenants
      - ./global_assets:/app/global_assets
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./compare_results:/app/compare_results
    restart: unless-stopped
    # ===== 资源上限 =====
    # 把失控计算（如卡死的 CalculateFormula、超大文件、AI 脚本吃内存）的爆炸半径锁在容器内，
    # OOM 时被杀的是容器而不是宿主机 VM，避免拖垮整机/无法重启。可在 .env 调整：
    # 固定限制应用容器的内存、CPU 和进程数，避免智算失控拖垮 Ubuntu/Hyper-V 宿主机。
    # memswap_limit 与 mem_limit 相同：不允许容器在 8G 之外继续大量使用 Swap。
    mem_limit: 8g
    mem_reservation: ${APP_MEM_RESERVATION:-2g}
    memswap_limit: 8g
    cpus: 2
    pids_limit: 512
    # ===== 容器日志限制 =====
    # json-file 驱动默认无上限：智训/智算高频 stdout 日志（每行 flush 即一次磁盘写）会无限增长，
    # 持续写盘（overlay → Ubuntu → .vhdx → 宿主 Windows C 盘 IO）。限制单文件 50m、保留 3 个，
    # 日志写满自动轮转。应用侧日志已异步化（QueueListener），此处再压一档磁盘 IO。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # ===== 磁盘 IO 限速（可选，按实际设备启用）=====
    # 智训/智算突发读写（xlsx 保存、日志、overlay 写放大）不打满 VM 磁盘 → 宿主 C 盘 IO 可控。
    # 容器内 `df -h /` 或 `cat /proc/diskstats` 查设备名（常见 /dev/sda 或 /dev/vda），
    # 确认后取消注释并填对 path 即可生效：
    # device_write_bps:
    #   - path: /dev/sda
    #     rate: 100mb
    # device_read_bps:
    #   - path: /dev/sda
    #     rate: 100mb
