version: '3.8'

services:
  app:
    build: .
    image: datamerge:latest
    container_name: datamerge-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # DATABASE_URL 从 .env 读取（PostgreSQL），不在此处硬编码
      - LD_LIBRARY_PATH=/app/libs:/usr/lib
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_ROLL_FORWARD=LatestMajor
    volumes:
      - ./tenants:/app/tenants
      - ./global_assets:/app/global_assets
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./compare_results:/app/compare_results
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 资源上限：把失控计算（如卡死的 CalculateFormula、超大文件）的爆炸半径锁在容器内，
    # OOM 时被杀的是容器而不是宿主机 VM，避免拖垮整机/无法重启。可在 .env 调整：
    #   APP_MEM_LIMIT=4g   APP_MEM_RESERVATION=1g   APP_CPUS=2
    mem_limit: ${APP_MEM_LIMIT:-4g}
    mem_reservation: ${APP_MEM_RESERVATION:-1g}
    cpus: ${APP_CPUS:-2}

  redis:
    image: redis:7-alpine
    container_name: datamerge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
