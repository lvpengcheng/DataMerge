version: '3.8'

services:
  app:
    build: .
    # 多环境（dev/uat 同机不同目录）：镜像名/容器名/端口都从本目录 .env 读取，
    # 不设时回落到默认值＝原单环境行为。同机多环境必须让这些值各不相同，否则会互相覆盖/端口冲突。
    image: ${IMAGE_NAME:-datamerge}:latest
    container_name: ${APP_CONTAINER_NAME:-datamerge-app}
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - REDIS_URL=redis://redis:6379/0
      # DATABASE_URL 从 .env 读取（PostgreSQL），不在此处硬编码
      - LD_LIBRARY_PATH=/app/libs:/usr/lib
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - DOTNET_ROLL_FORWARD=LatestMajor
    volumes:
      - ./tenants:/app/tenants
      - ./global_assets:/app/global_assets
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./compare_results:/app/compare_results
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 资源上限：把失控计算（如卡死的 CalculateFormula、超大文件）的爆炸半径锁在容器内，
    # OOM 时被杀的是容器而不是宿主机 VM，避免拖垮整机/无法重启。可在 .env 调整：
    #   APP_MEM_LIMIT=4g   APP_MEM_RESERVATION=1g   APP_CPUS=2
    mem_limit: ${APP_MEM_LIMIT:-4g}
    mem_reservation: ${APP_MEM_RESERVATION:-1g}
    cpus: ${APP_CPUS:-2}

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-datamerge-redis}
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
